# Netlify configuration

[build]
  # Static site: nothing to compile. Serve files from the project root.
  publish = "."
  functions = "netlify/functions"

# Pretty API paths: /api/generate-plan  ->  /.netlify/functions/generate-plan
# status = 200 means rewrite (proxy), not a visible redirect, so it's same-origin.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
