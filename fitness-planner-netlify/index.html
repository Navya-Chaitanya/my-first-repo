<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fitness Planner</title>

<!-- ============================================================= -->
<!--  Tailwind + React (CDN). No build step required.              -->
<!-- ============================================================= -->
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  body { background:#0b1020; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#2a3350; border-radius:6px; }
  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px);} to {opacity:1; transform:none;} }
</style>
</head>
<body>
<div id="root"></div>

<!-- =================================================================== -->
<!--  CONFIG — Wired for Vercel serverless functions (see /api).         -->
<!--                                                                     -->
<!--  These point at same-origin functions, so there's nothing to edit   -->
<!--  to go live: just set the env vars on Vercel (see README.md).        -->
<!--  Leave a URL empty ("") to fall back to the built-in MOCK generator -->
<!--  for that action (useful for local preview without keys).           -->
<!-- =================================================================== -->
<script>
window.FITNESS_CONFIG = {
  appName: "Fitness Planner",

  // Same-origin Vercel functions. Keys stay server-side in env vars.
  generatePlanWebhook: "/api/generate-plan",   // -> Gemini, returns { workout, meal }
  emailPlanWebhook:     "/api/email-plan",      // -> Resend, emails the plan

  // Optional: add /api/save-plan + a database later, then fill these in.
  savePlanWebhook: "",
  loadPlanWebhook: "",

  // Not used on Vercel (same-origin; secrets never reach the browser).
  authHeaderName: "x-api-key",
  authHeaderValue: ""
};
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;
const CFG = window.FITNESS_CONFIG;

/* ===================================================================
   API LAYER  —  talks to n8n if a URL is set, otherwise uses mocks
   =================================================================== */
function authHeaders() {
  const h = { "Content-Type": "application/json" };
  if (CFG.authHeaderValue) h[CFG.authHeaderName] = CFG.authHeaderValue;
  return h;
}

// Tracks where the last plan came from so the UI can tell the user.
//   "live"     = real backend responded
//   "mock"     = no webhook configured
//   "fallback" = webhook configured but unreachable (e.g. file opened locally,
//                or deployed without API keys set) -> used built-in generator
let lastGenSource = "mock";

async function apiGeneratePlan(profile) {
  if (!CFG.generatePlanWebhook) { lastGenSource = "mock"; return mockGenerate(profile); }
  try {
    const res = await fetch(CFG.generatePlanWebhook, {
      method: "POST", headers: authHeaders(), body: JSON.stringify(profile)
    });
    if (!res.ok) throw new Error("status " + res.status);
    const data = await res.json();
    lastGenSource = "live";
    // Accept either {workout,meal} directly or {plan:{workout,meal}}
    return data.plan ? data.plan : data;
  } catch (e) {
    // Backend not reachable — keep the app usable with a sample plan.
    lastGenSource = "fallback";
    return mockGenerate(profile);
  }
}

async function apiEmailPlan(email, plan) {
  if (!CFG.emailPlanWebhook) { await wait(500); return { mocked: true }; }
  try {
    const res = await fetch(CFG.emailPlanWebhook, {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ email, plan })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return { failed: true, error: data.error || ("HTTP " + res.status) };
    return data;
  } catch (e) {
    return { failed: true, error: e.message };
  }
}

async function apiSavePlan(email, profile, plan) {
  if (!CFG.savePlanWebhook) return { mocked:true };
  const res = await fetch(CFG.savePlanWebhook, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ email, profile, plan })
  });
  if (!res.ok) throw new Error("Save webhook returned " + res.status);
  return res.json().catch(() => ({}));
}

async function apiLoadPlan(email) {
  if (!CFG.loadPlanWebhook) return null;
  const res = await fetch(CFG.loadPlanWebhook, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ email })
  });
  if (!res.ok) return null;
  return res.json().catch(() => null);
}

const wait = (ms) => new Promise(r => setTimeout(r, ms));

/* ===================================================================
   MOCK PLAN GENERATOR  — realistic fallback so the app works offline
   =================================================================== */
function mockGenerate(p) {
  return wait(900).then(() => {
    const days = Math.min(Math.max(parseInt(p.daysPerWeek) || 4, 2), 6);
    const goal = p.goal;
    const weight = parseFloat(p.weight) || 75;
    // crude calorie target
    const base = weight * 24 * (p.activity === "high" ? 1.7 : p.activity === "low" ? 1.35 : 1.5);
    const target = Math.round(goal === "lose" ? base - 400 : goal === "gain" ? base + 350 : base);
    const protein = Math.round(weight * (goal === "gain" ? 2.0 : 1.8));
    const fat = Math.round((target * 0.27) / 9);
    const carbs = Math.round((target - protein * 4 - fat * 9) / 4);

    const split = {
      2: ["Full Body A", "Full Body B"],
      3: ["Push", "Pull", "Legs"],
      4: ["Upper", "Lower", "Push", "Pull"],
      5: ["Push", "Pull", "Legs", "Upper", "Lower"],
      6: ["Push", "Pull", "Legs", "Push", "Pull", "Legs"]
    }[days];

    const lib = {
      Push:["Bench Press","Overhead Press","Incline DB Press","Lateral Raise","Triceps Pushdown"],
      Pull:["Deadlift","Pull-ups","Barbell Row","Face Pull","Biceps Curl"],
      Legs:["Back Squat","Romanian Deadlift","Leg Press","Walking Lunge","Calf Raise"],
      Upper:["Bench Press","Barbell Row","Overhead Press","Pull-ups","Curl + Pushdown"],
      Lower:["Back Squat","Romanian Deadlift","Leg Press","Leg Curl","Calf Raise"],
      "Full Body A":["Back Squat","Bench Press","Barbell Row","Plank","Calf Raise"],
      "Full Body B":["Deadlift","Overhead Press","Pull-ups","Lunge","Hanging Leg Raise"]
    };
    const repScheme = goal === "gain" ? "5–8" : goal === "lose" ? "12–15" : "8–12";

    const workout = {
      summary: `${days}-day ${goal === "lose" ? "fat-loss" : goal === "gain" ? "muscle-building" : "maintenance"} split`,
      days: split.map((name, i) => ({
        day: `Day ${i + 1}`,
        focus: name,
        exercises: lib[name].map((ex, j) => ({
          name: ex,
          sets: j === 0 ? 4 : 3,
          reps: repScheme,
          rest: j === 0 ? "2–3 min" : "60–90 s"
        }))
      }))
    };

    const mealTemplate = (kcal) => {
      const veg = p.diet === "vegan" || p.diet === "vegetarian";
      const pro = veg ? ["Tofu","Tempeh","Lentils","Greek yogurt"] : ["Chicken breast","Eggs","Salmon","Lean beef"];
      const pick = (a) => a[Math.floor(Math.random()*a.length)];
      return [
        { meal:"Breakfast", items:`Oats + berries + ${veg?"soy yogurt":"eggs"}`, kcal:Math.round(kcal*0.25) },
        { meal:"Lunch", items:`${pick(pro)} + rice + greens`, kcal:Math.round(kcal*0.35) },
        { meal:"Snack", items:`${veg?"Hummus + veg":"Cottage cheese"} + fruit`, kcal:Math.round(kcal*0.15) },
        { meal:"Dinner", items:`${pick(pro)} + quinoa + roasted veg`, kcal:Math.round(kcal*0.25) }
      ];
    };

    const meal = {
      calories: target, protein, carbs, fat,
      note: p.diet && p.diet !== "none" ? `Tailored for a ${p.diet} diet.` : "Balanced omnivore plan.",
      days: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => ({
        day: d, meals: mealTemplate(target)
      }))
    };

    return { workout, meal };
  });
}

/* ===================================================================
   SMALL UI PRIMITIVES
   =================================================================== */
const Card = ({ children, className="" }) =>
  <div className={"rounded-2xl bg-[#141a2e] border border-white/5 shadow-xl " + className}>{children}</div>;

const Field = ({ label, children }) =>
  <label className="block">
    <span className="text-xs font-medium text-slate-400">{label}</span>
    <div className="mt-1">{children}</div>
  </label>;

const inputCls = "w-full rounded-lg bg-[#0e1426] border border-white/10 px-3 py-2 text-sm text-slate-100 focus:border-indigo-400 focus:outline-none";

const Pill = ({ active, onClick, children }) =>
  <button type="button" onClick={onClick}
    className={"px-3 py-1.5 rounded-full text-sm border transition " +
      (active ? "bg-indigo-500 border-indigo-400 text-white" : "bg-transparent border-white/15 text-slate-300 hover:border-white/40")}>
    {children}
  </button>;

/* ===================================================================
   GOALS / ONBOARDING FORM
   =================================================================== */
function GoalsForm({ initial, onSubmit, loading }) {
  const [f, setF] = useState(initial || {
    name:"", email:"", age:"28", sex:"male", height:"175", weight:"75",
    goal:"lose", activity:"medium", daysPerWeek:"4", diet:"none", equipment:"gym"
  });
  const set = (k,v) => setF(s => ({ ...s, [k]:v }));
  const submit = (e) => { e.preventDefault(); onSubmit(f); };

  return (
    <Card className="p-6 fade-in">
      <h2 className="text-lg font-semibold text-white">Your details</h2>
      <p className="text-sm text-slate-400 mt-1">We use these to generate a workout and nutrition plan.</p>
      <form onSubmit={submit} className="mt-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Field label="Name"><input className={inputCls} value={f.name} onChange={e=>set("name",e.target.value)} placeholder="Alex" /></Field>
        <Field label="Email (for delivery)"><input type="email" required className={inputCls} value={f.email} onChange={e=>set("email",e.target.value)} placeholder="you@email.com" /></Field>
        <Field label="Age"><input type="number" className={inputCls} value={f.age} onChange={e=>set("age",e.target.value)} /></Field>
        <Field label="Sex">
          <select className={inputCls} value={f.sex} onChange={e=>set("sex",e.target.value)}>
            <option value="male">Male</option><option value="female">Female</option><option value="other">Other</option>
          </select>
        </Field>
        <Field label="Height (cm)"><input type="number" className={inputCls} value={f.height} onChange={e=>set("height",e.target.value)} /></Field>
        <Field label="Weight (kg)"><input type="number" className={inputCls} value={f.weight} onChange={e=>set("weight",e.target.value)} /></Field>

        <div className="sm:col-span-2">
          <span className="text-xs font-medium text-slate-400">Goal</span>
          <div className="mt-2 flex flex-wrap gap-2">
            {[["lose","Lose fat"],["maintain","Maintain"],["gain","Build muscle"]].map(([v,l])=>
              <Pill key={v} active={f.goal===v} onClick={()=>set("goal",v)}>{l}</Pill>)}
          </div>
        </div>

        <div className="sm:col-span-2">
          <span className="text-xs font-medium text-slate-400">Activity level</span>
          <div className="mt-2 flex flex-wrap gap-2">
            {[["low","Low"],["medium","Moderate"],["high","High"]].map(([v,l])=>
              <Pill key={v} active={f.activity===v} onClick={()=>set("activity",v)}>{l}</Pill>)}
          </div>
        </div>

        <Field label="Training days / week">
          <select className={inputCls} value={f.daysPerWeek} onChange={e=>set("daysPerWeek",e.target.value)}>
            {[2,3,4,5,6].map(n=><option key={n} value={n}>{n} days</option>)}
          </select>
        </Field>
        <Field label="Equipment">
          <select className={inputCls} value={f.equipment} onChange={e=>set("equipment",e.target.value)}>
            <option value="gym">Full gym</option><option value="home">Home / dumbbells</option><option value="bodyweight">Bodyweight only</option>
          </select>
        </Field>

        <div className="sm:col-span-2">
          <span className="text-xs font-medium text-slate-400">Dietary preference</span>
          <div className="mt-2 flex flex-wrap gap-2">
            {[["none","No restriction"],["vegetarian","Vegetarian"],["vegan","Vegan"],["keto","Keto"]].map(([v,l])=>
              <Pill key={v} active={f.diet===v} onClick={()=>set("diet",v)}>{l}</Pill>)}
          </div>
        </div>

        <div className="sm:col-span-2 mt-2">
          <button disabled={loading}
            className="w-full rounded-xl bg-gradient-to-r from-indigo-500 to-violet-500 py-3 font-semibold text-white shadow-lg hover:opacity-95 disabled:opacity-60">
            {loading ? "Generating your plan…" : "Generate my plan"}
          </button>
        </div>
      </form>
    </Card>
  );
}

/* ===================================================================
   PLAN VIEWS
   =================================================================== */
function MacroStat({ label, value, unit }) {
  return (
    <div className="rounded-xl bg-[#0e1426] border border-white/5 px-4 py-3 text-center">
      <div className="text-2xl font-bold text-white">{value}<span className="text-sm text-slate-400 ml-0.5">{unit}</span></div>
      <div className="text-xs text-slate-400 mt-0.5">{label}</div>
    </div>
  );
}

function WorkoutView({ workout }) {
  return (
    <Card className="p-6 fade-in">
      <div className="flex items-center justify-between">
        <h3 className="text-lg font-semibold text-white">Workout plan</h3>
        <span className="text-xs text-slate-400">{workout.summary}</span>
      </div>
      <div className="mt-4 space-y-4">
        {workout.days.map((d,i)=>(
          <div key={i} className="rounded-xl border border-white/5 overflow-hidden">
            <div className="flex items-center justify-between bg-[#0e1426] px-4 py-2">
              <span className="font-medium text-indigo-300">{d.day}</span>
              <span className="text-sm text-slate-300">{d.focus}</span>
            </div>
            <table className="w-full text-sm">
              <thead><tr className="text-slate-500 text-xs">
                <th className="text-left font-medium px-4 py-1.5">Exercise</th>
                <th className="text-center font-medium py-1.5">Sets</th>
                <th className="text-center font-medium py-1.5">Reps</th>
                <th className="text-right font-medium px-4 py-1.5">Rest</th>
              </tr></thead>
              <tbody>
                {d.exercises.map((ex,j)=>(
                  <tr key={j} className="border-t border-white/5">
                    <td className="px-4 py-2 text-slate-200">{ex.name}</td>
                    <td className="text-center text-slate-300">{ex.sets}</td>
                    <td className="text-center text-slate-300">{ex.reps}</td>
                    <td className="px-4 py-2 text-right text-slate-400">{ex.rest}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ))}
      </div>
    </Card>
  );
}

function MealView({ meal }) {
  return (
    <Card className="p-6 fade-in">
      <div className="flex items-center justify-between">
        <h3 className="text-lg font-semibold text-white">Nutrition plan</h3>
        <span className="text-xs text-slate-400">{meal.note}</span>
      </div>
      <div className="mt-4 grid grid-cols-4 gap-3">
        <MacroStat label="Calories" value={meal.calories} unit="kcal" />
        <MacroStat label="Protein" value={meal.protein} unit="g" />
        <MacroStat label="Carbs" value={meal.carbs} unit="g" />
        <MacroStat label="Fat" value={meal.fat} unit="g" />
      </div>
      <div className="mt-5 space-y-3">
        {meal.days.map((d,i)=>(
          <div key={i} className="rounded-xl border border-white/5">
            <div className="bg-[#0e1426] px-4 py-2 font-medium text-emerald-300 text-sm">{d.day}</div>
            <div className="divide-y divide-white/5">
              {d.meals.map((m,j)=>(
                <div key={j} className="flex items-center justify-between px-4 py-2 text-sm">
                  <div><span className="text-slate-200 font-medium">{m.meal}</span> <span className="text-slate-400">— {m.items}</span></div>
                  <span className="text-slate-400">{m.kcal} kcal</span>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </Card>
  );
}

/* ===================================================================
   ROOT APP
   =================================================================== */
function App() {
  const [profile, setProfile] = useState(null);
  const [plan, setPlan] = useState(null);
  const [tab, setTab] = useState("workout");
  const [loading, setLoading] = useState(false);
  const [toast, setToast] = useState(null);
  const [emailing, setEmailing] = useState(false);

  const flash = (msg, ok=true) => { setToast({ msg, ok }); setTimeout(()=>setToast(null), 3200); };

  // Restore last session
  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("fp_session") || "null");
      if (saved && saved.plan) { setProfile(saved.profile); setPlan(saved.plan); }
    } catch {}
  }, []);

  const generate = useCallback(async (form) => {
    setLoading(true);
    try {
      // Try to load a previously saved plan from backend first (optional)
      const generated = await apiGeneratePlan(form);
      setProfile(form); setPlan(generated); setTab("workout");
      localStorage.setItem("fp_session", JSON.stringify({ profile:form, plan:generated }));
      apiSavePlan(form.email, form, generated).catch(()=>{});
      flash("Plan generated.", true);
    } catch (e) {
      flash("Couldn't generate plan: " + e.message, false);
    } finally { setLoading(false); }
  }, []);

  const emailPlan = async () => {
    if (!profile?.email) return flash("No email on file.", false);
    setEmailing(true);
    try {
      const r = await apiEmailPlan(profile.email, plan);
      if (r && r.failed) flash("Couldn't send the email. Please try again.", false);
      else flash(`Plan emailed to ${r.sentTo || profile.email}.`, true);
    } catch (e) { flash("Email failed: " + e.message, false); }
    finally { setEmailing(false); }
  };

  const reset = () => { setPlan(null); setProfile(null); localStorage.removeItem("fp_session"); };

  const live = !!CFG.generatePlanWebhook;

  return (
    <div className="min-h-screen text-slate-100">
      <header className="border-b border-white/5 bg-[#0b1020]/80 backdrop-blur sticky top-0 z-10">
        <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <div className="h-8 w-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-500 grid place-items-center font-bold">F</div>
            <span className="font-semibold">{CFG.appName}</span>
          </div>
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-4 py-8">
        {!plan ? (
          <div className="max-w-2xl mx-auto">
            <h1 className="text-2xl font-bold text-white mb-1">Plan your fitness</h1>
            <p className="text-slate-400 mb-6">Tell us your goals and get a personalized workout + nutrition plan.</p>
            <GoalsForm initial={profile} onSubmit={generate} loading={loading} />
          </div>
        ) : (
          <div className="fade-in">
            <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
              <div>
                <h1 className="text-2xl font-bold text-white">{profile.name ? profile.name + "'s plan" : "Your plan"}</h1>
                <p className="text-slate-400 text-sm capitalize">{profile.goal} · {profile.daysPerWeek} days/week · {profile.diet} diet</p>
              </div>
              <div className="flex gap-2">
                <button onClick={emailPlan} disabled={emailing}
                  className="rounded-xl bg-emerald-500 px-4 py-2 text-sm font-semibold text-white hover:opacity-95 disabled:opacity-60">
                  {emailing ? "Sending…" : "Email me this plan"}
                </button>
                <button onClick={reset} className="rounded-xl border border-white/15 px-4 py-2 text-sm text-slate-300 hover:border-white/40">
                  New plan
                </button>
              </div>
            </div>

            <div className="flex gap-2 mb-4">
              <Pill active={tab==="workout"} onClick={()=>setTab("workout")}>Workout</Pill>
              <Pill active={tab==="meal"} onClick={()=>setTab("meal")}>Nutrition</Pill>
            </div>

            {tab==="workout" ? <WorkoutView workout={plan.workout} /> : <MealView meal={plan.meal} />}
          </div>
        )}
      </main>

      {toast && (
        <div className={"fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl text-sm shadow-xl border " +
          (toast.ok ? "bg-[#10241c] border-emerald-500/40 text-emerald-200" : "bg-[#2a1620] border-rose-500/40 text-rose-200")}>
          {toast.msg}
        </div>
      )}

      <footer className="max-w-5xl mx-auto px-4 py-6" />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
